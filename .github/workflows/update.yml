name: Update Polish Leaderboard

on:
  schedule:
    # Uruchamia się codziennie o 00:00, 06:00, 12:00 i 18:00 czasu UTC
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # Dodaje przycisk w panelu GitHuba do ręcznego uruchamiania
  repository_dispatch: # <--- NOWE: Pozwala na uruchomienie skryptu przez API z zewnątrz (Next.js)
    types: [trigger-scraper]

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    
    # Nadajemy uprawnienia do modyfikowania repozytorium
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Run Scraper Script
        run: python scraper.py

      - name: Sync to Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python sync_to_supabase.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "Leaderboard-Agent"
          git config --global user.email "agent@dota2.com"
          git add polish_top.json
          # Commituje i pushuje TYLKO jeśli plik faktycznie się zmienił (ktoś awansował/spadł)
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Polish Top 5000" && git push)
