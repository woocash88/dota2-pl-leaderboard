name: Update Polish Leaderboard

on:
  schedule:
    # Uruchamia się codziennie o 00:00 i 12:00 czasu UTC
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Dodaje przycisk w panelu GitHuba do ręcznego uruchamiania

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    
    # Nadajemy uprawnienia do modyfikowania repozytorium
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "Leaderboard-Agent"
          git config --global user.email "agent@dota2.com"
          git add polish_top.json
          # Commituje i pushuje TYLKO jeśli plik faktycznie się zmienił (ktoś awansował/spadł)
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Polish Top 5000" && git push)
